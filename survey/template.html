<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangulation in R</title>
<meta name="description" content="A survey of R packages that triangulate points, polygons and segment sets: algorithm, upstream library, input, constraints and output control.">
<style>
:root {
  color-scheme: light;
  --surface-0: #f6f5f2;
  --surface-1: #fcfcfb;
  --border: #e3e1db;
  --grid: #ebe9e4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --link: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2f2f2c;
    --grid: #282826;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --link: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #2f2f2c;
  --grid: #282826;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --link: #3987e5;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.01em; }
h2 { font-size: 19px; margin: 40px 0 8px; }
p, li { max-width: 760px; }
.muted { color: var(--text-muted); font-size: 13px; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--link); }
.tablewrap { overflow-x: auto; margin: 12px 0; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px;
  border-bottom: 1px solid var(--grid); min-width: 9em; }
th:first-child, td:first-child { min-width: 13em; }
tr:last-child td { border-bottom: none; }
th { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body>
<main>
<p class="muted"><a href="../">trianglewins</a> / survey</p>
$body$
</main>
<script>
document.querySelectorAll("table").forEach(function (t) {
  var w = document.createElement("div");
  w.className = "tablewrap";
  t.parentNode.insertBefore(w, t);
  w.appendChild(t);
});
</script>
</body>
</html>
